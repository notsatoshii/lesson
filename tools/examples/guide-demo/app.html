<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모아노트 (테스트용 가상 앱)</title>
<style>
  :root { --ink: #1f2328; --muted: #6b7280; --line: #e5e7eb; --brand: #3b6ef5; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Malgun Gothic", "Noto Sans KR", sans-serif; color: var(--ink); background: #f6f7f9; word-break: keep-all; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; background: #fff; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 19px; margin: 0; }
  #account { font-size: 13px; color: var(--muted); }
  main { padding: 18px; }
  .list .item { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .item b { display: block; font-size: 16px; margin-bottom: 4px; }
  .item span { font-size: 13px; color: var(--muted); }
  #new { position: fixed; right: 20px; bottom: 28px; background: var(--brand); color: #fff; border: 0; border-radius: 28px; padding: 15px 22px; font-size: 16px; font-family: inherit; box-shadow: 0 6px 16px rgba(59,110,245,.35); }
  #editor { display: none; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  body.editing #editor { display: block; }
  body.editing .list, body.editing #new { display: none; }
  label { font-size: 14px; color: var(--muted); display: block; margin: 6px 0; }
  input, textarea { width: 100%; font: inherit; font-size: 16px; padding: 12px; border: 1px solid #cfd4dc; border-radius: 10px; }
  textarea { height: 160px; margin-bottom: 14px; }
  #save { width: 100%; background: var(--brand); color: #fff; border: 0; border-radius: 10px; padding: 14px; font: inherit; font-size: 16px; }
  #toast { display: none; margin-top: 14px; padding: 12px 14px; background: #e8f5ec; color: #17633a; border-radius: 10px; font-size: 15px; }
  body.saved #toast { display: block; }
</style>
</head>
<body>
<header><h1>모아노트</h1><span id="account">minji.kim@example.com</span></header>
<main>
  <section class="list">
    <div class="item"><b>회의 준비물</b><span>노트북, 발표 자료, 명함</span></div>
    <div class="item"><b>이번 주 할 일</b><span>보고서 초안 보내기, 팀 점심 예약</span></div>
    <div class="item"><b>읽을 책</b><span>추천받은 책 세 권 정리</span></div>
  </section>
  <section id="editor">
    <label for="title">제목</label>
    <input id="title" placeholder="제목을 입력하세요">
    <label for="body">내용</label>
    <textarea id="body" placeholder="내용을 입력하세요"></textarea>
    <button id="save">저장</button>
    <div id="toast">저장했어요. 목록에서 확인할 수 있어요.</div>
  </section>
</main>
<button id="new">+ 새 메모</button>
<script>
  document.getElementById('new').onclick = () => document.body.classList.add('editing');
  document.getElementById('save').onclick = () => document.body.classList.add('saved');
</script>
</body>
</html>
